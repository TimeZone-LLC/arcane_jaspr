name: arcane_jaspr
description: "A Jaspr web framework port of the Arcane UI component library. Build beautiful web applications with Dart using familiar Arcane patterns."
version: 5.0.1
homepage: https://timezone-llc.github.io/arcane_jaspr/
documentation: https://timezone-llc.github.io/arcane_jaspr/
repository: https://github.com/ArcaneArts/arcane_jaspr

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  jaspr: '>=0.23.1 <1.0.0'
  meta: ^1.18.3
  fast_log: ^1.0.7
  web: ^1.1.1
  http: ^1.6.0

dev_dependencies:
  jaspr_test: '>=0.23.1 <1.0.0'
  lints: ^6.1.0
  build_runner: ^2.15.0
  jaspr_builder: '>=0.23.1 <1.0.0'
  arcane_jaspr_shadcn:
    path: packages/arcane_jaspr_shadcn
  arcane_jaspr_neon:
    path: packages/arcane_jaspr_neon
  arcane_jaspr_neubrutalism:
    path: packages/arcane_jaspr_neubrutalism
  arcane_jaspr_win95:
    path: packages/arcane_jaspr_win95

scripts:
  # dart autoconst
  autoconst: dart-auto-const
  # Code Generation
  build_runner: dart run build_runner build --delete-conflicting-outputs
  # Generate ArcaneIcon wrapper for all Lucide icons
  generate_icons: dart tool/generate_icons.dart
  serve: dart tool/arcane_jaspr_demo.dart
  serve_release: dart tool/arcane_jaspr_demo.dart serve --release
  serve_demo: dart tool/arcane_jaspr_demo.dart
  build_demo: dart tool/arcane_jaspr_demo.dart build
