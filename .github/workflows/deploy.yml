name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'arcane_jaspr_docs/**'
      - 'lib/**'
      - 'packages/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcane_jaspr_docs/arcane_jaspr_docs_web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Checkout arcane_lexicon dependency
        working-directory: .
        run: git clone --depth 1 https://github.com/ArcaneArts/arcane_lexicon.git ../arcane_lexicon

      - name: Install dependencies
        run: dart pub get

      - name: Install jaspr CLI
        run: dart pub global activate jaspr_cli

      - name: Generate search index
        run: dart tool/generate_search_index.dart --base-url=/arcane_jaspr

      - name: Build static site
        run: dart pub global run jaspr_cli:jaspr build --dart-define=BASE_URL=/arcane_jaspr

      - name: Install browser policy runner
        working-directory: tool/browser_policy
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Enforce browser design policy
        working-directory: .
        shell: bash
        run: |
          audit_root=$(mktemp -d)
          ln -s "$GITHUB_WORKSPACE/arcane_jaspr_docs/arcane_jaspr_docs_web/build/jaspr" \
            "$audit_root/arcane_jaspr"
          python3 -m http.server 41737 --bind 127.0.0.1 \
            --directory "$audit_root" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ARCANE_DOCS_URL=http://127.0.0.1:41737/arcane_jaspr \
            npm --prefix tool/browser_policy run audit

      - name: Add .nojekyll
        run: touch build/jaspr/.nojekyll

      - name: Copy 404.html for SPA routing
        run: cp build/jaspr/index.html build/jaspr/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: arcane_jaspr_docs/arcane_jaspr_docs_web/build/jaspr

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Rebuilds the arcane_lexicon docs against this arcane_jaspr revision.
      # The token is a fine-grained PAT scoped to arcane_lexicon only.
      - name: Trigger arcane_lexicon docs rebuild
        env:
          GH_TOKEN: ${{ secrets.ARCANE_LEXICON_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ARCANE_LEXICON_DISPATCH_TOKEN is not set; skipping the arcane_lexicon rebuild."
            exit 0
          fi
          gh api repos/TimeZone-LLC/arcane_lexicon/dispatches \
            -f event_type=arcane-jaspr-updated \
            -f "client_payload[arcane_jaspr_sha]=$GITHUB_SHA"
          echo "Dispatched arcane-jaspr-updated to TimeZone-LLC/arcane_lexicon for $GITHUB_SHA."
