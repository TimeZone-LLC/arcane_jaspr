name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The repo root hosts nested projects (packages/*, arcane_jaspr_docs/)
          # whose dependencies are not resolved in this job. A bare
          # `dart analyze` from the root builds broken analysis contexts for
          # them and reports phantom uri_does_not_exist errors, so the root job
          # analyzes only the core package's own source directories.
          - package: "."
            analyze_paths: bin lib test tool
          - package: packages/arcane_jaspr_shadcn
          - package: packages/arcane_jaspr_ascii
          - package: packages/arcane_jaspr_neon
          - package: packages/arcane_jaspr_neubrutalism
          - package: packages/arcane_jaspr_win95
          # arcane_lexicon is unpublished, so arcane_jaspr_kb resolves it from
          # a sibling checkout (see its dependency_overrides) and cannot pass a
          # publish dry run until arcane_lexicon is published.
          - package: packages/arcane_jaspr_kb
            needs_lexicon: true
            skip_publish: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Same sibling-checkout pattern as the docs deploy workflow: the kb
      # package's dependency_overrides points at ../arcane_lexicon relative to
      # this workspace.
      - name: Checkout arcane_lexicon dependency
        if: matrix.needs_lexicon == true
        run: git clone --depth 1 https://github.com/ArcaneArts/arcane_lexicon.git ../arcane_lexicon

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: dart pub get

      # Plain `dart analyze` (no --fatal-infos): the packages ship pre-existing
      # analyzer infos (prefer_const_constructors, use_null_aware_elements, etc.)
      # that would fail --fatal-infos. This still fails the build on any
      # error or warning. Mirrors the commands documented in AGENTS.md.
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze ${{ matrix.analyze_paths }}

      # Run `dart test` only when real test files exist. Another package may not
      # have a test/ dir at all; the core test/ dir may contain non-test sources.
      # If *_test.dart files exist and any test fails, this fails the build.
      - name: Test
        working-directory: ${{ matrix.package }}
        shell: bash
        run: |
          if find test -name '*_test.dart' -type f 2>/dev/null | grep -q .; then
            echo "Found *_test.dart files; running dart test."
            dart test
          else
            echo "No *_test.dart files found; skipping dart test."
          fi

      - name: Browser tests
        if: matrix.package == '.'
        env:
          CHROME_EXECUTABLE: google-chrome
        run: find test -name '*_browser_test.dart' -type f -print0 | xargs -0 dart test --platform chrome --concurrency=1

      - name: Publish dry run
        if: matrix.skip_publish != true
        working-directory: ${{ matrix.package }}
        run: dart pub publish --dry-run
